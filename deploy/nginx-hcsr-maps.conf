# Nginx site for maps.hcsr-eg.org -> Streamlit on 127.0.0.1:8501
# Copy to /etc/nginx/sites-available/hcsr-maps, link it into sites-enabled, then
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d maps.hcsr-eg.org        (free HTTPS certificate)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name maps.hcsr-eg.org;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        # Streamlit talks to the browser over a WebSocket - these lines are required
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # photos are plain files: let the browser cache them for a week
    location /app/static/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }
}
